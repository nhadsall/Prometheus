global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
          - base:9100
          - css:9100
          - curo:9100
          - gkc:9100
          - key:9100
          - ns1:9100
          - oak:9100
          - red:9100
          - sjm:9100
          - spirit:9100
          - tekton:9100

  - job_name: php-fpm
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets:
          - css:9253
          - curo:9253
          - gkc:9253
          - key:9253
          - oak:9253
          - red:9253
          - spirit:9253
          - tekton:9253
