apiVersion: 1

groups:
  - orgId: 1
    name: fleet
    folder: Fleet
    interval: 1m
    rules:
      - uid: fleet-host-down
        title: Host down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.instance }} is not being scraped"
        labels:
          severity: warning
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cee3l7v6urpj4f
            model:
              datasource:
                type: prometheus
                uid: cee3l7v6urpj4f
              editorMode: code
              expr: up{job="node-exporter"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
      - uid: fleet-disk-week
        title: Disk full within a week
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is forecast to fill within 7 days"
        labels:
          severity: warning
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: cee3l7v6urpj4f
            model:
              datasource:
                type: prometheus
                uid: cee3l7v6urpj4f
              editorMode: code
              expr: predict_linear(node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}[6h], 7 * 24 * 3600)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: lt
      - uid: fleet-fpm-queue
        title: PHP-FPM listen queue
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.instance }} pool {{ $labels.pool }} has a listen queue"
        labels:
          severity: warning
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cee3l7v6urpj4f
            model:
              datasource:
                type: prometheus
                uid: cee3l7v6urpj4f
              editorMode: code
              expr: phpfpm_listen_queue
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
